{% extends 'base.html' %}

{% block title %}Nuevo Proveedor{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
                <h4 class="mb-0 fw-bold"><i class="fas fa-truck me-2"></i> Nuevo Proveedor</h4>
                <a href="{% url 'productos:lista_proveedores' %}" class="btn btn-sm btn-light fw-bold">
                    <i class="fas fa-arrow-left me-1"></i> Volver a la Lista
                </a>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Razón Social / Nombre</label>
                        {{ form.nombre_o_razon_social }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">CUIT</label>
                        {{ form.cuit }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Teléfono</label>
                        {{ form.telefono }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Correo Electrónico</label>
                        {{ form.email }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Dirección Comercial</label>
                        {{ form.direccion }}
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4 border-top pt-3">
                        <a href="{% url 'productos:lista_proveedores' %}" class="btn btn-secondary px-4">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-success px-4">
                            <i class="fas fa-save me-1"></i> Guardar Proveedor
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
