{% extends 'base.html' %}

{% block title %}Historial de Ventas{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold mb-0">
        <i class="fas fa-history text-primary me-2"></i> Historial de Ventas
    </h3>
    <div class="d-flex align-items-center gap-2">
        <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2" id="indicadorAutoUpdate">
            <i class="fas fa-sync-alt fa-spin me-1"></i> En vivo
        </span>
        <a href="{% url 'ventas:pos' %}" class="btn btn-primary fw-bold shadow-sm">
            <i class="fas fa-cash-register me-1"></i> Ir al POS
        </a>
    </div>
</div>

<!-- TABLA DE VENTAS EN VIVO -->
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>Fecha y Hora</th>
                        <th>Cliente</th>
                        <th>Vendedor</th>
                        <th>Método de Pago</th>
                        <th>Total</th>
                        <th class="text-center pe-3">Acciones</th>
                    </tr>
                </thead>
                <tbody id="contenedorTablaVentas">
                    {% include 'ventas/tabla_ventas_partial.html' %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const contenedorTabla = document.getElementById('contenedorTablaVentas');

        function actualizarVentasEnVivo() {
            fetch("{% url 'ventas:lista_ventas' %}", {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => {
                if (response.ok) {
                    return response.text();
                }
                throw new Error('Error en respuesta');
            })
            .then(htmlPartial => {
                contenedorTabla.innerHTML = htmlPartial;
            })
            .catch(error => console.log('Sincronizando ventas...', error));
        }

        // Consultar automáticamente cada 3 segundos
        setInterval(actualizarVentasEnVivo, 3000);
    });
</script>
{% endblock %}
