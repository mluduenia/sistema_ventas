{% extends 'base.html' %}

{% block title %}Nuevo Cliente | Sistema POS{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-body py-3 border-bottom d-flex align-items-center justify-content-between">
                    <h5 class="fw-bold mb-0 text-body">
                        <i class="fas fa-user-plus me-2 text-primary"></i> Registrar Nuevo Cliente
                    </h5>
                    <a href="javascript:history.back()" class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-arrow-left me-1"></i> Volver
                    </a>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{% url 'ventas:crear_cliente' %}">
                        {% csrf_token %}

                        <!-- Razón Social o Nombre Completo -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold small">Razón Social / Nombre Completo <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej: Juan Pérez o Empresa S.A." required>
                        </div>

                        <div class="row g-3 mb-3">
                            <!-- CUIT / DNI con botón ARCA -->
                            <div class="col-12 col-sm-6">
                                <label for="cuit_dni" class="form-label fw-bold small">CUIT / DNI <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="cuit_dni" name="cuit_dni" placeholder="Sin guiones ni puntos" required>
                                    <button type="button" class="btn btn-outline-primary" id="btn-consultar-padron" title="Consultar datos en ARCA">
                                        <i class="fas fa-cloud-download-alt"></i> ARCA
                                    </button>
                                </div>
                                <small id="padron-status" class="d-block mt-1"></small>
                            </div>

                            <!-- Condición de IVA -->
                            <div class="col-12 col-sm-6">
                                <label for="condicion_iva" class="form-label fw-bold small">Condición frente al IVA</label>
                                <select class="form-select" id="condicion_iva" name="condicion_iva">
                                    <option value="5" selected>Consumidor Final</option>
                                    <option value="1">IVA Responsable Inscripto</option>
                                    <option value="6">Responsable Monotributo</option>
                                    <option value="4">IVA Sujeto Exento</option>
                                    <option value="7">Sujeto No Categorizado</option>
                                    <option value="15">IVA No Alcanzado</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <!-- Teléfono -->
                            <div class="col-12 col-sm-6">
                                <label for="telefono" class="form-label fw-bold small">Teléfono</label>
                                <input type="text" class="form-control" id="telefono" name="telefono" placeholder="Ej: 11 1234 5678">
                            </div>

                            <!-- Correo Electrónico -->
                            <div class="col-12 col-sm-6">
                                <label for="email" class="form-label fw-bold small">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="cliente@correo.com">
                            </div>
                        </div>

                        <!-- Dirección Comercial / Fiscal -->
                        <div class="mb-4">
                            <label for="direccion" class="form-label fw-bold small">Dirección Fiscal / Domicilio</label>
                            <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Calle, Número, Localidad">
                        </div>

                        <!-- Botones de Acción -->
                        <div class="d-flex justify-content-end gap-2 border-top pt-3">
                            <a href="javascript:history.back()" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4 fw-bold">
                                <i class="fas fa-save me-1"></i> Guardar Cliente
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 🔽 SCRIPT DE AUTORRELLENO POR CUIT (ARCA) -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    const btn = document.getElementById('btn-consultar-padron');
    const statusEl = document.getElementById('padron-status');
    const inputCuit = document.getElementById('cuit_dni');

    if (!btn || !inputCuit) return;

    // Formateo automático del CUIT mientras se escribe: 20-12345678-9
    inputCuit.addEventListener('input', function (e) {
        inputCuit.classList.remove('is-invalid');

        let v = e.target.value.replace(/\D/g, '').slice(0, 11);
        if (v.length > 10) {
            v = v.replace(/^(\d{2})(\d{8})(\d+)/, '$1-$2-$3');
        } else if (v.length > 2) {
            v = v.replace(/^(\d{2})(\d+)/, '$1-$2');
        }
        e.target.value = v;
    });

    btn.addEventListener('click', function () {
        const cuit = inputCuit.value.replace(/\D/g, '');

        if (cuit.length !== 11) {
            inputCuit.classList.add('is-invalid');
            statusEl.className = 'text-danger d-block mt-1';
            statusEl.innerHTML = '<i class="fas fa-exclamation-circle"></i> Ingresá un CUIT de 11 dígitos.';
            return;
        }

        inputCuit.classList.remove('is-invalid');
        statusEl.className = 'text-muted d-block mt-1';
        statusEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Consultando ARCA...';
        btn.disabled = true;

        fetch(`{% url 'ventas:consultar_padron' %}?cuit=${cuit}`)
            .then(r => r.json())
            .then(res => {
                // ---- CASO ERROR ----
                if (!res.success) {
                    inputCuit.classList.add('is-invalid');
                    const msg = res.error || 'No se pudo obtener datos.';

                    if (res.tipo === 'no_encontrado' || res.tipo === 'sin_datos') {
                        alert('⚠️ CUIT no encontrado\n\n' + msg);
                    } else if (res.tipo === 'autenticacion' || res.tipo === 'configuracion') {
                        alert('🔧 Error de configuración\n\n' + msg);
                    } else if (res.tipo === 'conexion' || res.tipo === 'soap') {
                        alert('📡 Error de conexión con ARCA\n\n' + msg);
                    } else {
                        alert('❌ Error\n\n' + msg);
                    }

                    statusEl.className = 'text-danger d-block mt-1';
                    statusEl.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + msg;
                    return;
                }

                // ---- CASO ÉXITO ----
                const d = res.data;
                inputCuit.classList.remove('is-invalid');

                const setVal = (id, val) => {
                    const el = document.getElementById(id);
                    if (el && val) el.value = val;
                };
                setVal('nombre', d.nombre);
                setVal('direccion', d.direccion);

                // 🔽 NUEVO: Rellenar el select de condición IVA con mapeo texto → código
                const selectIva = document.getElementById('condicion_iva');
                if (selectIva && d.condicion_iva) {
                    const MAPEO_IVA = {
                        'IVA RESPONSABLE INSCRIPTO': '1',
                        'RESPONSABLE INSCRIPTO': '1',
                        'IVA SUJETO EXENTO': '4',
                        'SUJETO EXENTO': '4',
                        'EXENTO': '4',
                        'CONSUMIDOR FINAL': '5',
                        'RESPONSABLE MONOTRIBUTO': '6',
                        'MONOTRIBUTO': '6',
                        'SUJETO NO CATEGORIZADO': '7',
                        'IVA NO ALCANZADO': '15',
                    };

                    const upper = String(d.condicion_iva).toUpperCase().trim();
                    let codigo = null;

                    // Buscar coincidencia exacta o parcial
                    for (const [texto, cod] of Object.entries(MAPEO_IVA)) {
                        if (upper === texto || upper.includes(texto) || texto.includes(upper)) {
                            codigo = cod;
                            break;
                        }
                    }

                    // Si ya viene un código numérico, usarlo directo
                    if (!codigo && /^\d+$/.test(upper)) {
                        codigo = upper;
                    }

                    // Fallback: buscar por texto de las opciones
                    if (!codigo) {
                        const opt = Array.from(selectIva.options).find(o =>
                            o.text.toUpperCase().includes(upper) ||
                            upper.includes(o.text.toUpperCase().trim())
                        );
                        if (opt) codigo = opt.value;
                    }

                    if (codigo) {
                        selectIva.value = codigo;
                    }
                }

                statusEl.className = 'text-success d-block mt-1';
                statusEl.innerHTML = '<i class="fas fa-check-circle"></i> Datos cargados desde ARCA.';
            })
            .catch(err => {
                inputCuit.classList.add('is-invalid');
                statusEl.className = 'text-danger d-block mt-1';
                statusEl.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error de conexión con el servidor.';
                alert('📡 No se pudo conectar con el servidor.\n\nVerificá tu conexión o intentá de nuevo.');
            })
            .finally(() => {
                btn.disabled = false;
            });
    });
});
</script>
{% endblock %}
