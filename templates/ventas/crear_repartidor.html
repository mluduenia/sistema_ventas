{% extends 'base.html' %}

{% block title %}Nuevo Repartidor{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-body py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0">
                        <i class="fas fa-user-plus text-success me-2"></i> Nuevo Repartidor
                    </h5>
                    <a href="{% url 'ventas:lista_repartidores' %}" class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-arrow-left me-1"></i> Volver
                    </a>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}

                        <!-- DATOS DE ACCESO -->
                        <h6 class="fw-bold text-secondary mb-3 border-bottom pb-2">
                            <i class="fas fa-key me-2"></i> Datos de Acceso al Sistema
                        </h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">
                                    Usuario <span class="text-danger">*</span>
                                </label>
                                <input type="text" name="username" class="form-control"
                                       value="{{ form_data.username|default:'' }}"
                                       placeholder="ej: pedro.martinez" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">
                                    Contraseña <span class="text-danger">*</span>
                                </label>
                                <input type="password" name="password" class="form-control"
                                       placeholder="Contraseña de acceso" required>
                            </div>
                        </div>

                        <!-- DATOS PERSONALES -->
                        <h6 class="fw-bold text-secondary mb-3 border-bottom pb-2">
                            <i class="fas fa-user me-2"></i> Datos Personales
                        </h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">
                                    Nombre <span class="text-danger">*</span>
                                </label>
                                <input type="text" name="first_name" class="form-control"
                                       value="{{ form_data.first_name|default:'' }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">
                                    Apellido <span class="text-danger">*</span>
                                </label>
                                <input type="text" name="last_name" class="form-control"
                                       value="{{ form_data.last_name|default:'' }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">DNI</label>
                                <input type="text" name="dni" class="form-control"
                                       value="{{ form_data.dni|default:'' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Teléfono</label>
                                <input type="text" name="telefono" class="form-control"
                                       value="{{ form_data.telefono|default:'' }}"
                                       placeholder="ej: 11 5555-1234">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-bold small">Email</label>
                                <input type="email" name="email" class="form-control"
                                       value="{{ form_data.email|default:'' }}">
                            </div>
                        </div>

                        <!-- DATOS DEL RODADO -->
                        <h6 class="fw-bold text-secondary mb-3 border-bottom pb-2">
                            <i class="fas fa-motorcycle me-2"></i> Vehículo y Zona
                        </h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Vehículo</label>
                                <input type="text" name="vehiculo" class="form-control"
                                       value="{{ form_data.vehiculo|default:'' }}"
                                       placeholder="ej: Moto Honda 150">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Patente</label>
                                <input type="text" name="patente" class="form-control"
                                       value="{{ form_data.patente|default:'' }}"
                                       placeholder="ej: ABC123">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Zona Asignada</label>
                                <input type="text" name="zona" class="form-control"
                                       value="{{ form_data.zona|default:'' }}"
                                       placeholder="ej: Centro, Norte, Sur">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Licencia de Conducir</label>
                                <input type="text" name="licencia_conducir" class="form-control"
                                       value="{{ form_data.licencia_conducir|default:'' }}">
                            </div>
                        </div>

                        <!-- ESTADO Y NOTAS -->
                        <div class="row g-3 mb-4">
                            <div class="col-md-12">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" name="activo"
                                           id="chk_activo" checked>
                                    <label class="form-check-label fw-bold small" for="chk_activo">
                                        Repartidor activo (puede recibir pedidos)
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label fw-bold small">Observaciones</label>
                                <textarea name="observaciones" class="form-control" rows="2"
                                          placeholder="Notas internas...">{{ form_data.observaciones|default:'' }}</textarea>
                            </div>
                        </div>

                        <!-- BOTONES -->
                        <div class="d-flex justify-content-end gap-2 border-top pt-3">
                            <a href="{% url 'ventas:lista_repartidores' %}" class="btn btn-secondary px-4">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-success px-4 fw-bold">
                                <i class="fas fa-save me-1"></i> Crear Repartidor
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
