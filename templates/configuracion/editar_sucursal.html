{% extends 'base.html' %}

{% block title %}Editar Sucursal{% endblock %}

{% block content %}
<div class="container-fluid py-3">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-body py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="fw-bold mb-0">
                        <i class="fas fa-store text-primary me-2"></i>
                        Editar Sucursal: {{ sucursal.nombre }}
                    </h5>
                    <a href="{% url 'configuracion:lista_sucursales' %}" class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-arrow-left me-1"></i> Volver
                    </a>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="row g-3 mb-4">
                            <div class="col-md-8">
                                <label class="form-label fw-bold small">
                                    Nombre <span class="text-danger">*</span>
                                </label>
                                <input type="text" name="nombre" class="form-control"
                                       value="{{ sucursal.nombre }}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold small">Tipo</label>
                                <select name="tipo" class="form-select">
                                    <option value="CENTRAL" {% if sucursal.tipo == 'CENTRAL' %}selected{% endif %}>Central / Planta</option>
                                    <option value="SUCURSAL" {% if sucursal.tipo == 'SUCURSAL' %}selected{% endif %}>Sucursal</option>
                                    <option value="DEPOSITO" {% if sucursal.tipo == 'DEPOSITO' %}selected{% endif %}>Depósito</option>
                                </select>
                            </div>

                            <div class="col-md-8">
                                <label class="form-label fw-bold small">Dirección</label>
                                <input type="text" name="direccion" class="form-control"
                                       value="{{ sucursal.direccion }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold small">Teléfono</label>
                                <input type="text" name="telefono" class="form-control"
                                       value="{{ sucursal.telefono }}">
                            </div>

                            <div class="col-md-8">
                                <label class="form-label fw-bold small">Email</label>
                                <input type="email" name="email" class="form-control"
                                       value="{{ sucursal.email }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold small">Punto de Venta ARCA</label>
                                <input type="number" name="punto_de_venta_arca" class="form-control"
                                       value="{{ sucursal.punto_de_venta_arca }}" min="1">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Lista de Precios</label>
                                <select name="lista_precio" class="form-select">
                                    <option value="">-- Sin asignar --</option>
                                    {% for lista in listas_precio %}
                                        <option value="{{ lista.id }}"
                                                {% if sucursal.lista_precio_id == lista.id %}selected{% endif %}>
                                            {{ lista.nombre }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" name="activa"
                                           id="chk_activa" {% if sucursal.activa %}checked{% endif %}>
                                    <label class="form-check-label fw-bold small" for="chk_activa">
                                        Sucursal activa
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" name="es_central"
                                           id="chk_central" {% if sucursal.es_central %}checked{% endif %}>
                                    <label class="form-check-label fw-bold small" for="chk_central">
                                        Es la sucursal Central / Principal
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 border-top pt-3">
                            <a href="{% url 'configuracion:lista_sucursales' %}" class="btn btn-secondary px-4">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary px-4 fw-bold">
                                <i class="fas fa-save me-1"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
