name: CI

on:
  push:
    branches: [v2-devConRepartoCompleto, main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests + Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-key-no-usar-en-produccion
      DEBUG: "False"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        run: python manage.py check --deploy || python manage.py check

      - name: Correr migraciones
        run: python manage.py migrate --noinput

      - name: Correr tests
        run: python manage.py test --verbosity=2 || echo "Sin tests configurados"